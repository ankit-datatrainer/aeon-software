<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Aeon Software Services</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-dark);
            text-align: center;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }
        .error-content {
            position: relative;
            z-index: 2;
            max-width: 600px;
        }
        .error-code {
            font-size: clamp(6rem, 15vw, 12rem);
            font-weight: 800;
            line-height: 1;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
            letter-spacing: -0.04em;
        }
        .error-title {
            font-size: clamp(1.75rem, 4vw, 2.5rem);
            color: var(--text-light);
            font-weight: 700;
            margin-bottom: 1rem;
        }
        .error-desc {
            color: rgba(255, 255, 255, 0.6);
            font-size: var(--fs-md);
            margin-bottom: 2.5rem;
            line-height: 1.7;
        }
        .error-btn-wrap {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <div class="cursor-dot" id="cursorDot"></div>
    <div class="cursor-ring" id="cursorRing"></div>

    <section class="error-page">
        <div class="hero-gradient"></div>
        <div class="error-content">
            <div class="error-code">404</div>
            <h1 class="error-title">Page Not Found</h1>
            <p class="error-desc">
                The digital frontier you're looking for doesn't exist or has moved to another dimension. Let's get you back on track.
            </p>
            <div class="error-btn-wrap">
                <a href="/" class="btn btn-primary">
                    <span class="btn-text">Back to Home</span>
                    <span class="btn-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    </span>
                </a>
                <a href="/#services" class="btn btn-ghost">
                    <span class="btn-text">Explore Services</span>
                </a>
            </div>
        </div>
    </section>
</body>
</html>
